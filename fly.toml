# Deploy: fly launch --copy-config --no-deploy, then fly volumes create triage_data --size 1 --region sin, then fly deploy.
# One machine only: state lives in SQLite on the volume and the rate limiter is in memory.
app = "withdrawal-triage-demo"
primary_region = "sin"

[build]

[env]
  DEMO_MODE = "true"
  MODEL_PROVIDER = "mock"
  CLOCK_PIN = "2026-11-10T03:00:00.000Z"
  LOG_LEVEL = "info"

[mounts]
  source = "triage_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
